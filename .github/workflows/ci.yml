name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-test:
    name: Apple Silicon · Xcode 26.3
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Official action, pinned to the verified v7.0.1 release commit.
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Check repository and licensed data
        run: python3 scripts/check-repository.py
      - name: Check localization resources and source coverage
        run: python3 scripts/check-localization.py
      - name: Test publication history checker
        run: python3 Development/verify-publication-history.py
      - name: Check development script syntax
        run: |
          for script in scripts/test.sh scripts/build-app.sh; do
            bash -n "$script"
          done
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for directory in (Path("scripts"), Path("Development")):
              for path in directory.glob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Run native tests
        run: ./scripts/test.sh
      - name: Build Release application
        run: ./scripts/build-app.sh
      - name: Verify application and CLI
        run: |
          python3 scripts/check-built-app.py dist/CartaPDF.app
          dist/CartaPDF.app/Contents/MacOS/CartaPDF --cli help

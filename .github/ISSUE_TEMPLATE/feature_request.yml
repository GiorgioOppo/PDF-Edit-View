name: Feature request
description: A new tool or a concrete improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Task to simplify
      description: Describe what you want to achieve and the limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Give an example of input, operation and result. Use synthetic examples without personal information.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and alternatives
      description: CartaPDF must remain free, local and based only on Apple frameworks. Include relevant compatibility constraints and alternatives you have tried.

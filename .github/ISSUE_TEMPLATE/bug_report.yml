name: Bug report
description: Reproducible incorrect behavior or a regression.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem using a synthetic document where possible. Remove personal information, signatures, passwords and confidential content from PDFs, images and logs. For vulnerabilities, follow [SECURITY.md](https://github.com/GiorgioOppo/PDF-Edit-View/blob/main/SECURITY.md); do not open a public report with exploitable details.
  - type: input
    id: version
    attributes:
      label: CartaPDF version or commit
      placeholder: "3.6.0 or commit hash"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and architecture
      placeholder: "macOS 15, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and observed result
      description: Include the tool, parameters, minimal steps and any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal example and checks performed
      description: For PDF/A, include the profile, check ID and location. Distinguish a demonstrated violation from an unverified check. Do not attach ISO standards or private documents. Prefer a synthetic example with a redistributable license.
